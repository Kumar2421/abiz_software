# One Netlify deploy serves both halves of Abiz:
#   web/out                      static export of the Next.js frontend
#   server/netlify/functions/api  the whole Express API, as one function
#
# Same origin for both means the session cookie is first-party (Safari blocks
# third-party cookies) and there is no CORS preflight on every request.

[build]
  # `npm ci` must run WITHOUT NODE_ENV=production or npm skips devDependencies,
  # where TypeScript and Tailwind live — hence --include=dev. The Next build
  # then runs in production mode, because a stray NODE_ENV=development makes it
  # build React in dev mode and crash prerendering /_global-error.
  command = """
    npm --prefix server ci --include=dev && \
    npm --prefix server run build && \
    npm --prefix web ci --include=dev && \
    NODE_ENV=production npm --prefix web run build
  """
  publish = "web/out"
  functions = "server/netlify/functions"

[build.environment]
  NODE_VERSION = "22"
  # Empty means "same origin": the API is served from /api on this very domain
  # by the function below. Do not set this in the Netlify UI unless the API is
  # moved to a separate host — a stale value gets compiled into the bundle.
  NEXT_PUBLIC_API_URL = ""

[functions]
  node_bundler = "esbuild"
  # PGlite carries a large wasm payload and is only reachable when DATABASE_URL
  # is unset, which never happens in production. Keep it out of the bundle.
  external_node_modules = ["@electric-sql/pglite"]

# /api/* and /health are claimed by the function itself, via `export const
# config = { path: [...] }` in api.mjs. Declaring redirects here as well would
# rewrite the URL and hide the real path from Express.

# Anything else that is not a real file gets the exported 404 page.
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
