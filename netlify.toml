# Netlify builds the frontend only. The Express + Socket.IO API cannot run
# here (no long-running process) — deploy it to Render, Railway, or Fly and
# point NEXT_PUBLIC_API_URL at it.

[build]
  base = "web"
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

[[plugins]]
  package = "@netlify/plugin-nextjs"
