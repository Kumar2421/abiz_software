# The frontend is a fully static export — every route is client-rendered behind
# a session cookie and the API is a separate Express service. Serving the
# exported HTML directly means no Next.js runtime on Netlify.

[build]
  # NODE_ENV is forced to production for the build step only. `npm ci` must run
  # WITHOUT it: with NODE_ENV=production npm skips devDependencies, and
  # typescript/tailwind live there. A stray NODE_ENV=development makes Next
  # build React in dev mode, which crashes prerendering /_global-error.
  # --include=dev is explicit insurance: if NODE_ENV=production is set as a
  # site variable, npm would otherwise skip devDependencies and the build dies
  # on "Cannot find module '@tailwindcss/postcss'".
  command = "npm --prefix web ci --include=dev && NODE_ENV=production npm --prefix web run build"
  publish = "web/out"

[build.environment]
  NODE_VERSION = "22"

# Unknown paths get the exported 404 page rather than a bare server error.
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
