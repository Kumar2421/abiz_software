name: CI

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web lint and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install web dependencies
        run: npm --prefix web ci --include=dev
      - name: Lint web
        run: npm --prefix web run lint
      - name: Build static web app
        run: NODE_ENV=production npm --prefix web run build

  server:
    name: API build and typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install server dependencies
        run: npm --prefix server ci --include=dev
      - name: Build API
        run: npm --prefix server run build
      - name: Typecheck API
        run: npm --prefix server run typecheck
